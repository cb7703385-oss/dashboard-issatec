services:
  db:
    image: postgres:16-alpine
    container_name: livedata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: livedata_dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d livedata_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: livedata-dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1180:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://dashboard:dashboard@db:5432/livedata_dashboard
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SEED_DEMO_ON_START: "true"
      LIVE_DEMO_REFRESH: ${LIVE_DEMO_REFRESH:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}

volumes:
  postgres_data:
